<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B2A4A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Nosso Jardim — gestação e glicemia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1F6; --surface:#FFFFFF; --ink:#2A1A26; --muted:#6F5E6B; --line:#E4DCE3;
  --plum:#5B2A4A; --plum-soft:#EFE3EB; --leaf:#2F8F6B; --leaf-soft:#E2F3EB;
  --amber:#B86E0A; --amber-soft:#FBEFD9; --danger:#B3261E; --danger-soft:#FBE3E1;
  --water:#2C7DB8; --water-soft:#E2EFF8;
  --s-cafe:#B86E0A; --s-almoco:#2F8F6B; --s-jantar:#2C7DB8; --s-jejum:#8A3F6E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1218; --surface:#251B22; --ink:#F3E9F0; --muted:#B9A7B4; --line:#3A2D36;
    --plum:#D9A6C6; --plum-soft:#3A2533; --leaf:#6FCF9F; --leaf-soft:#1E3329;
    --amber:#F0B25A; --amber-soft:#3A2C17; --danger:#FF8A80; --danger-soft:#3D1F1D;
    --water:#7DB9E8; --water-soft:#1B2B38;
    --s-cafe:#F0B25A; --s-almoco:#6FCF9F; --s-jantar:#7DB9E8; --s-jejum:#E7A9CF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1218; --surface:#251B22; --ink:#F3E9F0; --muted:#B9A7B4; --line:#3A2D36;
  --plum:#D9A6C6; --plum-soft:#3A2533; --leaf:#6FCF9F; --leaf-soft:#1E3329;
  --amber:#F0B25A; --amber-soft:#3A2C17; --danger:#FF8A80; --danger-soft:#3D1F1D;
  --water:#7DB9E8; --water-soft:#1B2B38;
  --s-cafe:#F0B25A; --s-almoco:#6FCF9F; --s-jantar:#7DB9E8; --s-jejum:#E7A9CF; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
header.top{padding:22px 4px 10px;display:flex;gap:14px;align-items:center}
.plantbox{width:88px;height:88px;flex:none;border-radius:50%;background:var(--plum-soft) url(foto-perfil.jpg) center/cover no-repeat;position:relative;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--plum)}
.pbadge{position:absolute;right:-8px;bottom:-8px;width:46px;height:46px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden}
.week{font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--plum)}
.sub{color:var(--muted);font-size:.9rem}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
h3{font-size:.95rem;margin:12px 0 6px;font-weight:700}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.daybar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
.daybar b{font-size:1.1rem}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:10px 14px;background:var(--plum);color:var(--surface);font-weight:600}
button.ghost{background:transparent;color:var(--plum);border:1px solid var(--line)}
button.small{padding:6px 10px;font-size:.85rem}
button.link{background:transparent;color:var(--plum);padding:4px 0;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
label.f{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbox{border-radius:14px;padding:10px;background:var(--bg);border:2px solid transparent}
.gbox.ok{background:var(--leaf-soft);border-color:var(--leaf)}
.gbox.high{background:var(--amber-soft);border-color:var(--amber)}
.gbox.low{background:var(--danger-soft);border-color:var(--danger)}
.gbox input{font-size:1.4rem;font-weight:700;background:transparent;border:none;padding:2px 0}
.gbox .meta{font-size:.75rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:end}
.row>*{flex:1}
.row>.nf{flex:none}
ul.list{list-style:none;margin:10px 0 0;padding:0}
ul.list li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.x{background:transparent;color:var(--muted);padding:4px 8px;font-size:1.1rem}
.drops{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.drop{width:30px;height:38px;padding:0;background:transparent;border-radius:8px}
.drop svg path{fill:var(--water-soft);stroke:var(--water);stroke-width:1.5}
.drop.on svg path{fill:var(--water)}
.check{display:flex;gap:10px;align-items:center;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--leaf);flex:none}
.alert{border-radius:14px;padding:12px;margin:12px 0;font-size:.92rem}
.alert.danger{background:var(--danger-soft);color:var(--ink);border:1px solid var(--danger)}
.alert.info{background:var(--plum-soft)}
.alert.ok{background:var(--leaf-soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.75rem;color:var(--muted);font-weight:600}
td.ok{color:var(--leaf);font-weight:700}
td.high{color:var(--amber);font-weight:700}
td.low{color:var(--danger);font-weight:800}
.big{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.mid{font-size:1.6rem;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{padding:10px 12px;border-radius:16px;max-width:88%;white-space:pre-wrap;font-size:.95rem}
.bub.u{align-self:flex-end;background:var(--plum);color:var(--surface);border-bottom-right-radius:4px}
.bub.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.reward{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.reward .cost{font-weight:800;color:var(--plum)}
.bar{height:10px;border-radius:99px;background:var(--plum-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1 1 auto;min-width:0;background:transparent;color:var(--muted);border-radius:0;padding:9px 0 11px;font-size:.6rem;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;overflow:visible}
nav.tabs button span{font-size:1.2rem;line-height:1}
nav.tabs button[aria-current="true"]{color:var(--plum);font-weight:800}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--plum-soft)}
.refrow{display:flex;gap:10px;align-items:flex-start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pcard{border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line);padding:0;text-align:left;color:var(--ink);font-weight:400;display:block;width:100%}
.pcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pcard .semfoto{width:100%;aspect-ratio:1}
.semfoto{display:grid;place-items:center;font-size:2rem;background:var(--plum-soft)}
.pcard .pt{padding:8px 10px;font-size:.85rem}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.modal .box{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal img{width:100%;border-radius:14px;display:block;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30;display:none;max-width:90vw;text-align:center}
.muted{color:var(--muted);font-size:.88rem}
.tiny{color:var(--muted);font-size:.78rem}
/* novos */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.seg button{padding:6px 11px;font-size:.82rem;border-radius:99px;background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--plum);color:var(--surface);border-color:var(--plum)}
.pos{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.85rem;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.high{background:var(--amber-soft);color:var(--amber)}
.pill.low{background:var(--danger-soft);color:var(--danger)}
.pill.wait{background:var(--plum-soft);color:var(--plum)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 .mid{color:var(--plum)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.kv b{white-space:nowrap}
details{border-top:1px solid var(--line);margin-top:10px}
details>summary{cursor:pointer;list-style:none;padding:10px 0 2px;font-weight:700;color:var(--plum);display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";font-weight:700}
details[open]>summary::after{content:"－"}
section.card>details:first-child{border-top:none;margin-top:0}
section.card>details:first-child>summary{padding-top:0}
.pbars .pb{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:.85rem;margin:7px 0}
.pbars .track{height:12px;border-radius:99px;background:var(--plum-soft);overflow:hidden}
.pbars .track i{display:block;height:100%;border-radius:99px}
.pbars .v{text-align:right;font-weight:700}
.corr{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.corr .t{flex:1;min-width:0;font-size:.9rem}
.baby{background:linear-gradient(135deg,var(--plum-soft),var(--leaf-soft));border:none}
.baby .wk{font-size:1.5rem;font-weight:800;color:var(--plum);line-height:1.1}
.babyrow{display:flex;gap:12px;align-items:center}
.babyrow .ic{font-size:2.4rem;line-height:1;flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card:not(.baby) .tags span{background:var(--bg)}
.tags span{background:var(--surface);border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:600}
.albumwk{display:flex;gap:12px;align-items:flex-start}
.albumwk .ph{width:74px;height:74px;border-radius:14px;object-fit:cover;flex:none;background:var(--plum-soft);display:grid;place-items:center;font-size:1.8rem}
.stage{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--plum)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sw input[type=checkbox]{width:22px;height:22px;accent-color:var(--leaf);flex:none}
.sw input[type=time]{width:132px;flex:none}
.sw .lab{flex:1;font-size:.93rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow>button{flex:1 1 140px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.gbox{transition:background .25s,border-color .25s}}
@media (max-width:360px){.wrap{padding:0 12px 110px}.week{font-size:1.7rem}.plantbox{width:76px;height:76px}.stat3 .mid{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="plantbox" id="plantSmall" role="img" aria-label="Foto da Thaismara"></div>
    <div>
      <div class="week" id="weekLbl">Semana —</div>
      <div class="sub">Um dia de cada vez, juntos.</div>
      <div class="chips" id="chips"></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   Nosso Jardim — núcleo: utilidades, estado, armazenamento e migração
   Dados: localStorage "jardim-cache" = {dias, config}
          IndexedDB "jardim-fotos" (store "fotos") = fotos por id
   ===================================================================== */
const APP_VERSAO='2.0';
const SCHEMA=2;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>iso(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDias=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const br=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const brAno=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const agoraHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const media=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const arred=v=>v==null?null:Math.round(v);
const isData=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);

/* Glicemias. Os limites vêm das metas configuradas (padrão 95 / 120). */
const GL=[['jejum','Jejum'],['cafe','2h após café'],['almoco','2h após almoço'],['jantar','2h após jantar']];
const GL_CURTO={jejum:'Jejum',cafe:'Pós-café',almoco:'Pós-almoço',jantar:'Pós-jantar'};
const HIPO=70; // mensagem geral de segurança (valor baixo)
const REF=['Café da manhã','Lanche da manhã','Almoço','Lanche da tarde','Jantar','Ceia'];
const REF_POS={'Café da manhã':'cafe','Almoço':'almoco','Jantar':'jantar'}; // só estas têm glicemia 2h correspondente
const POS_REF={cafe:'Café da manhã',almoco:'Almoço',jantar:'Jantar'};
const REF_EMOJI={'Café da manhã':'☕','Lanche da manhã':'🍎','Almoço':'🍽️','Lanche da tarde':'🥪','Jantar':'🌙','Ceia':'🥛'};

const PREMIOS_V2=[
  {id:'v2-louca',nome:'Gustavo lava a louça',custo:500},
  {id:'v2-banheiro',nome:'Gustavo lava o banheiro',custo:500},
  {id:'v2-quintal',nome:'Gustavo lava o quintal',custo:1000},
  {id:'v3-rainha',nome:'👑 Dia de rainha: Gustavo vira mordomo por um dia, com pano no braço, reverência e "pois não, Vossa Majestade?" a cada pedido',custo:2000},
  {id:"v4-jantar",nome:"🍳 Gustavo faz o jantar da noite (cardápio aprovado pela coach)",custo:400},
  {id:"v4-roupa",nome:"👕 Gustavo passa e dobra toda a roupa da semana",custo:600},
  {id:"v4-cama",nome:"🛏️ Gustavo troca a roupa de cama e arruma o quarto",custo:300},
  {id:"v4-cozinha",nome:"🧽 Faxina completa na cozinha: fogão, pia e geladeira por dentro",custo:800},
  {id:"v4-enxoval",nome:"🍼 Gustavo organiza o enxoval e o cantinho do bebê",custo:700},
  {id:"v4-lixo",nome:"🗑️ Uma semana levando o lixo e os recicláveis sem ela precisar pedir",custo:250},
  {id:"v4-mercado",nome:"🛒 Gustavo faz o mercado da semana sozinho, com a lista dela",custo:350},
  {id:"v4-casa",nome:"🧹 Gustavo aspira e passa pano na casa toda",custo:700},
  {id:"v4-carro",nome:"🚗 Gustavo lava o carro",custo:600},
  {id:"v4-cafe",nome:"☕ Café da manhã na cama preparado por Gustavo e Nicolas",custo:200},
  {id:"v4-parque",nome:"🛝 Gustavo leva o Nicolas ao parque por 2 horas enquanto ela descansa",custo:300},
  {id:"v4-noite",nome:"🛁 Gustavo cuida do banho, do jantar e da hora de dormir do Nicolas por uma noite",custo:250},
  {id:"v4-sabado",nome:"😴 Sábado de manhã livre: Gustavo e Nicolas saem e ela dorme até tarde",custo:500},
  {id:"v4-lanche",nome:"🧁 Gustavo e Nicolas preparam um lanche surpresa (saudável) para ela",custo:300},
  {id:"v4-cartinha",nome:"💌 Gustavo e Nicolas fazem uma cartinha para o bebê e leem para a barriga",custo:150},
  {id:"v4-cinema",nome:"🎬 Noite de cinema: ela escolhe o filme, os meninos montam a cabana de lençol",custo:350},
  {id:"v4-show",nome:"🎤 Show de talentos de Gustavo e Nicolas (dança e música) só para ela",custo:200},
  {id:"v4-passeio",nome:"🦁 Gustavo leva o Nicolas a um passeio especial e os dois trazem uma lembrança para ela",custo:900},
  {id:"v4-brinquedos",nome:"🧸 Gustavo e Nicolas arrumam juntos todos os brinquedos",custo:250},
  {id:"v4-spa",nome:"💅 Tarde de spa: massagem nos pés pelo Gustavo e unhas pintadas pelo Nicolas (esmalte infantil)",custo:400}
];
function defaultLembretes(){return{
  ativo:false,
  jejum:{on:false,hora:'07:00'},
  cafe:{on:false},almoco:{on:false},jantar:{on:false},
  vitaminas:{on:false,hora:'09:00'},
  agua:{on:false},
  pendentes:[],   // [{id,tipo,quando(ms),data}] lembretes de 2h após refeição
  enviados:{}     // {'AAAA-MM-DD':{jejum:true,...}}
}}
function defaultConfig(){return{
  gestRef:{data:'2026-09-25',semanas:17},
  metaAgua:10, vitaminas:['Polivitamínico gestacional','Ácido fólico'],
  insulinaPadrao:'NPH', pesoPre:null,
  premios:PREMIOS_V2.map(p=>({...p})),
  resgates:[],
  // novos na versão 2 (schema 2)
  metas:{jejum:95,pos:120},
  lembretes:defaultLembretes(),
  album:{},          // {'18':{nota:'',fotoId:null}}
  nomeBebe:'',
  relObs:'',
  ultimoBackup:null
}}

const S={dias:{},config:defaultConfig(),db:null,sel:hoje(),tab:'hoje',chat:[],busy:false,pendingRender:false,
  glicPer:14,glicSerie:'jejum',sub:null,relPer:14,relIni:null,relFim:null,relPdf:null,corrMais:false,albumEdit:null};
let primeiraVez=false;

/* ---------- migração (schema 1 → 2) ----------
   - nunca remove campos nem registros; só acrescenta o que falta com valor padrão
   - antes da primeira migração guarda uma cópia intacta em "jardim-cache-pre-v2" */
function numOk(v,min,max,pad){v=+v;return Number.isFinite(v)&&v>=min&&v<=max?v:pad}
function normalizarDia(k,o){
  if(!o||typeof o!=='object')o={};
  const n={...o};
  n.data=k;
  if(!n.glic||typeof n.glic!=='object')n.glic={};
  ['insulina','refeicoes','atividade'].forEach(f=>{if(!Array.isArray(n[f]))n[f]=[]});
  if(typeof n.agua!=='number')n.agua=+n.agua||0;
  if(!n.vitaminas||typeof n.vitaminas!=='object')n.vitaminas={};
  if(n.peso===undefined)n.peso=null;
  return n;
}
function normalizarConfig(c){
  const d=defaultConfig();c={...d,...(c||{})};
  c.gestRef=c.gestRef&&isData(c.gestRef.data)&&+c.gestRef.semanas>0?{...c.gestRef}:{...d.gestRef};
  { // semanas + dias sempre inteiros (corrige valores como 17,9 digitados antes)
    const g=c.gestRef,tot=Math.round((+g.semanas)*7+(+g.dias||0));
    g.semanas=Math.floor(tot/7);g.dias=tot%7; }
  c.metaAgua=numOk(c.metaAgua,1,30,10);
  if(!Array.isArray(c.vitaminas))c.vitaminas=d.vitaminas;
  if(!Array.isArray(c.premios))c.premios=d.premios;
  if(!Array.isArray(c.resgates))c.resgates=[];
  const m=c.metas||{};c.metas={jejum:numOk(m.jejum,60,200,95),pos:numOk(m.pos,60,250,120)};
  const L=defaultLembretes(),l=c.lembretes||{};
  c.lembretes={...L,...l};
  ['jejum','cafe','almoco','jantar','vitaminas','agua'].forEach(k=>{c.lembretes[k]={...L[k],...(l[k]||{})}});
  if(!Array.isArray(c.lembretes.pendentes))c.lembretes.pendentes=[];
  if(!c.lembretes.enviados||typeof c.lembretes.enviados!=='object')c.lembretes.enviados={};
  if(!c.album||typeof c.album!=='object')c.album={};
  if(typeof c.nomeBebe!=='string')c.nomeBebe='';
  if(typeof c.relObs!=='string')c.relObs='';
  return c;
}
function migrar(){
  const antes=+S.config.schema||1;let mudou=false;
  if(antes<2){
    try{if(!localStorage.getItem('jardim-cache-pre-v2')){const raw=localStorage.getItem('jardim-cache');if(raw)localStorage.setItem('jardim-cache-pre-v2',raw)}}catch(e){}
  }
  const antesTxt=JSON.stringify(S.config);
  S.config=normalizarConfig(S.config);
  Object.keys(S.dias).forEach(k=>{if(!isData(k))return;const n=normalizarDia(k,S.dias[k]);if(JSON.stringify(n)!==JSON.stringify(S.dias[k])){S.dias[k]=n;mudou=true}});
  if(!S.config.inicio){S.config.inicio=hoje()}
  // prêmios: acrescenta os que faltam, sem apagar os personalizados
  if((S.config.premiosVersao||1)<4){
    const tem=new Set(S.config.premios.map(p=>p.id));
    S.config.premios=S.config.premios.filter(p=>p.id!=='v2-melancia');
    PREMIOS_V2.forEach(p=>{if(!tem.has(p.id))S.config.premios.push({...p})});
    S.config.premiosVersao=4;
  }
  S.config.schema=SCHEMA;
  if(mudou||antesTxt!==JSON.stringify(S.config))cache();
}

/* =====================================================================
   Pontos, jardim (8 estágios), cuidado/murcha e semana da gestação
   Os pontos NÃO dependem do valor da glicemia: premiam o cuidado.
   ===================================================================== */
function pontosDia(o){
  let p=0;const g=o.glic||{};
  GL.forEach(([k])=>{if(g[k]!=null)p+=5});
  p+=Math.min((o.insulina||[]).length,2)*10;
  p+=Math.min((o.refeicoes||[]).length,6)*3;
  if((o.agua||0)>=S.config.metaAgua)p+=10;
  if((o.atividade||[]).reduce((a,b)=>a+(+b.min||0),0)>=20)p+=10;
  const vs=S.config.vitaminas;if(vs.length&&vs.every(v=>o.vitaminas&&o.vitaminas[v]))p+=5;
  if(o.peso)p+=5;
  const pos=['cafe','almoco','jantar'].filter(k=>g[k]!=null).length;
  if(g.jejum!=null&&pos>=2)p+=10;
  return p;
}
function pontosAte(dataFim){return Object.keys(S.dias).filter(d=>d<=dataFim).reduce((a,d)=>a+pontosDia(S.dias[d]),0)}
function totais(){
  const total=Object.values(S.dias).reduce((a,o)=>a+pontosDia(o),0);
  const gasto=(S.config.resgates||[]).reduce((a,r)=>a+r.custo,0);
  let seq=0,d=hoje();
  if(!(S.dias[d]&&S.dias[d].glic&&S.dias[d].glic.jejum!=null))d=addDays(d,-1);
  while(S.dias[d]&&S.dias[d].glic&&S.dias[d].glic.jejum!=null){seq++;d=addDays(d,-1)}
  return{total,saldo:total-gasto,seq,nivel:Math.floor(total/80),est:estagio(total)};
}

/* ---------- cuidado: a plantinha fica com sede, sem culpa ---------- */
function temRegistro(o){return !!o&&(Object.keys(o.glic||{}).length||(o.refeicoes||[]).length||(o.insulina||[]).length||o.agua||(o.atividade||[]).length||o.peso||Object.values(o.vitaminas||{}).some(Boolean))}
function cuidado(){
  const ini=S.config.inicio||hoje(),t=hoje();
  const conta=f=>{if(f(S.dias[t]))return 0;let n=0,d=addDays(t,-1);while(d>=ini&&!f(S.dias[d])){n++;d=addDays(d,-1)}return n};
  const semAt=conta(o=>o&&(o.atividade||[]).length>0),semReg=conta(temRegistro);
  const dias=Math.max(semAt,semReg);
  return{semAt,semReg,murcha:dias>=2,grau:dias>=4?2:1,motivo:semReg>=2?'registro':'atividade',dias};
}

/* ---------- desenho da planta por estágio (1..8) ---------- */
const FORMA=[null,
  {lv:0, top:'broto'},
  {lv:2, top:'broto'},
  {lv:4, top:'broto'},
  {lv:5, top:'botao'},
  {lv:6, top:'flor'},
  {lv:9, top:'flor',mini:1},
  {lv:11,top:'flor',mini:2,borb:1},
  {lv:14,top:'flor',mini:2,borb:1,jardim:1,brilho:1}

function planta(stage,size,est){
  stage=Math.max(1,Math.min(8,stage|0||1));
  est=est||cuidado();const m=est.murcha,g=est.grau;const F=FORMA[stage];
  const lv=F.lv,H=24+lv*3.4;
  const C={leaf:m?'#A3A15E':'#5DBB8A',leafDk:m?'#838148':'#3F9A6C',stem:m?'#8E8C52':'#4FA878',pet:m?'#CDA9B8':'#F4A6C6',petDk:m?'#B4919F':'#E27FA8',mid:m?'#D9C27A':'#F7C948'};
  const P0=[60,96];let P1,P2,P3;
  if(!m){P1=[54,96-H*.35];P2=[66,96-H*.7];P3=[60,96-H]}
  else if(g===1){P1=[58,96-H*.4];P2=[60+H*.1,96-H*.95];P3=[60+H*.35,96-H*.78]}
  else{P1=[58,96-H*.4];P2=[60+H*.25,96-H*1.0];P3=[60+H*.5,96-H*.55]}
  const bz=t=>{const u=1-t;return[0,1].map(k=>u*u*u*P0[k]+3*u*u*t*P1[k]+3*u*t*t*P2[k]+t*t*t*P3[k])};
  const n=Math.min(1+Math.floor(lv/2),6),ang=!m?-32:(g===1?35:62);
  let leaves='',extra=[];
  for(let i=0;i<n;i++){
    const t=.22+i*(.6/n),[x,y]=bz(t),side=i%2?-1:1,sc=.75+.25*(1-i/n);
    leaves+=`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${side*sc},${sc}) rotate(${ang})"><path d="M0 0 C5 -9 16 -10 23 -3 C16 3 6 4 0 0Z" fill="${C.leaf}"/><path d="M1 0 Q11 -3 20 -3" stroke="${C.leafDk}" stroke-width="1" fill="none" stroke-linecap="round"/></g>`;
    const r=ang*Math.PI/180;extra.push([x+side*sc*21*Math.cos(r),y+sc*21*Math.sin(r)]);
  }
  const flor=(x,y,s,rot,c1,c2)=>`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot}) scale(${s})">${[0,1,2,3,4].map(k=>`<ellipse cx="0" cy="-8.5" rx="5.8" ry="8.5" fill="${k%2?(c2||C.petDk):(c1||C.pet)}" transform="rotate(${k*72})"/>`).join('')}<circle r="5.2" fill="${C.mid}"/><circle cx="-1.6" cy="-1.6" r="1.5" fill="#fff" opacity=".6"/></g>`;
  let topo='';const rot=!m?0:(g===1?55:100);
  if(F.top==='flor')topo=flor(P3[0],P3[1],.75+Math.min(lv-4,10)*.035,rot);
  else if(F.top==='botao')topo=`<g transform="translate(${P3[0]},${P3[1]}) rotate(${rot})"><ellipse cx="0" cy="-5" rx="4" ry="6.5" fill="${C.pet}"/><path d="M-4.5 0 Q0 -5 4.5 0 Q0 2 -4.5 0Z" fill="${C.leaf}"/></g>`;
  else topo=`<g transform="translate(${P3[0]},${P3[1]}) rotate(${rot})"><path d="M0 0 C-3 -6 -10 -7 -12 -3 C-8 0 -3 1 0 0Z" fill="${C.leaf}"/><path d="M0 0 C3 -6 10 -7 12 -3 C8 0 3 1 0 0Z" fill="${C.leaf}"/></g>`;
  let mini='';
  if(!m&&F.mini>=1&&extra[n-2])mini+=flor(extra[n-2][0],extra[n-2][1],.42,-20);
  if(!m&&F.mini>=2&&extra[n-3])mini+=flor(extra[n-3][0],extra[n-3][1],.4,15);
  const star=(x,y,r)=>`<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="#F7C948"/>`;
  const brilho=!m&&F.brilho?star(26,38,5)+star(96,28,4)+star(92,60,3):'';
  const borb=!m&&F.borb?`<g transform="translate(94,44) rotate(-12)"><ellipse cx="-5" cy="-3" rx="5.5" ry="4" fill="#9CC8F2"/><ellipse cx="5" cy="-3" rx="5.5" ry="4" fill="#B9A3F0"/><ellipse cx="-4" cy="3" rx="3.6" ry="2.8" fill="#B9A3F0"/><ellipse cx="4" cy="3" rx="3.6" ry="2.8" fill="#9CC8F2"/><rect x="-.8" y="-5" width="1.6" height="10" rx=".8" fill="#4A2A1F"/></g>`:'';
  const tufo=(x,s)=>`<g transform="translate(${x},129) scale(${s})"><path d="M-6 0 Q-5 -9 -2 -12 Q-2 -6 0 0Z M0 0 Q1 -11 4 -14 Q4 -7 5 0Z M5 0 Q8 -7 11 -8 Q9 -3 9 0Z" fill="${C.leaf}"/></g>`;
  const jardim=F.jardim?tufo(18,1)+tufo(100,1)+(m?'':flor(14,114,.45,10,'#F7B2A0','#EE8C78')+flor(106,112,.45,-15,'#F9D98A','#F2C14E')+flor(24,120,.32,0)):'';
  const olhos=!m?`<circle cx="51" cy="111" r="2.3" fill="#4A2A1F"/><circle cx="69" cy="111" r="2.3" fill="#4A2A1F"/><circle cx="51.8" cy="110.2" r=".7" fill="#fff"/><circle cx="69.8" cy="110.2" r=".7" fill="#fff"/>`
    :`<path d="M48.5 111 q2.5 2.2 5 0 M66.5 111 q2.5 2.2 5 0" stroke="#4A2A1F" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  const boca=!m?`<path d="M56.5 116 q3.5 3.6 7 0" stroke="#4A2A1F" stroke-width="1.6" fill="none" stroke-linecap="round"/>`:`<path d="M56.5 119 q3.5 -3 7 0" stroke="#4A2A1F" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  const gota=m?`<path d="M95 94 C92 99 91 101 91 103 a4 4 0 0 0 8 0 C99 101 98 99 95 94Z" fill="#8CC8F0"/>`:'';
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 132" role="img" aria-label="${m?'Plantinha com sede':'Plantinha: '+ESTAGIOS[stage-1].nome}">
    ${brilho}${jardim}
    <path d="M${P0} C${P1} ${P2} ${P3}" stroke="${C.stem}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    ${leaves}${mini}${topo}${borb}
    <path d="M34 97 H86 L80.5 125 Q79.5 129 75.5 129 H44.5 Q40.5 129 39.5 125Z" fill="#D9895B"/>
    <rect x="30" y="90" width="60" height="10" rx="5" fill="#E8A077"/>
    <ellipse cx="60" cy="91.5" rx="25" ry="2.6" fill="#6B4430"/>
    ${olhos}${!m?'<ellipse cx="45" cy="116" rx="3.6" ry="2.1" fill="#F29B9B" opacity=".75"/><ellipse cx="75" cy="116" rx="3.6" ry="2.1" fill="#F29B9B" opacity=".75"/>':''}${boca}${gota}
  </svg>`;
}

function notaSemana(s){
  if(s<13)return'No 1º trimestre, os órgãos principais do bebê estão se formando.';
  if(s<20)return'Muitas gestantes começam a sentir os primeiros movimentos entre 16 e 25 semanas — cada gestação tem seu tempo.';
  if(s<24)return'Metade da gestação! Em geral, é nesta fase que acontece o ultrassom morfológico.';
  if(s<28)return'O bebê já costuma reagir a sons e vozes de quem está por perto.';
  if(s<34)return'No 3º trimestre, o bebê ganha peso mais rapidamente.';
  if(s<37)return'O bebê continua ganhando peso e amadurecendo.';
  return'Gestação a termo: o momento do nascimento é acompanhado pela sua equipe.';
}
const nomeBebe=()=>(S.config.nomeBebe||'').trim();

/* =====================================================================
   Análises locais (nada sai do aparelho): correlação refeição → glicemia,
   estatísticas por período, descobertas e insights semanais.
   Linguagem de ASSOCIAÇÃO, nunca de causa.
   ===================================================================== */
const MIN_PADRAO=3; // mínimo de ocorrências para mostrar um padrão

function diasEntre(ini,fim){const out=[];let d=ini;let guard=0;while(d<=fim&&guard<4000){out.push(d);d=addDays(d,1);guard++}return out}
function primeiraData(){const ks=Object.keys(S.dias).filter(isData).sort();return ks[0]||hoje()}

/* Glicemia 2h correspondente a uma refeição (só café, almoço e jantar) */
function posDaRefeicao(data,r){
  const k=REF_POS[r&&r.tipo];if(!k)return null;
  const o=S.dias[data];const v=o&&o.glic?o.glic[k]:null;
  return{k,v:v==null?null:+v};
}
/* Histórico de combinações refeição → glicemia (apenas quando há as duas coisas) */
function paresRefeicao(ini,fim){
  const out=[];
  Object.keys(S.dias).filter(d=>isData(d)&&(!ini||d>=ini)&&(!fim||d<=fim)).sort().reverse().forEach(d=>{
    const o=S.dias[d];const g=o.glic||{};
    ['cafe','almoco','jantar'].forEach(k=>{
      if(g[k]==null)return;
      const refs=(o.refeicoes||[]).map((r,i)=>({...r,_i:i})).filter(r=>r.tipo===POS_REF[k]);
      if(!refs.length)return;
      const comCarbo=refs.filter(r=>r.carbo!=null);
      out.push({d,k,v:+g[k],refs,desc:refs.map(r=>r.desc).join(' + '),carbo:comCarbo.length?comCarbo.reduce((a,r)=>a+(+r.carbo||0),0):null,fotoId:(refs.find(r=>r.fotoId)||{}).fotoId||null});
    });
  });
  return out;
}

/* Estatísticas de um período */
function statsPeriodo(ini,fim){
  const ds=diasEntre(ini,fim);const por={};
  GL.forEach(([k])=>por[k]={vals:[],datas:[]});
  let agua=0,ativ=0,vit=0,diasReg=0;const vs=S.config.vitaminas;
  ds.forEach(d=>{const o=S.dias[d];if(!o)return;
    if(temRegistro(o))diasReg++;
    GL.forEach(([k])=>{const v=o.glic&&o.glic[k];if(v!=null&&v!==''){por[k].vals.push(+v);por[k].datas.push(d)}});
    if((o.agua||0)>=S.config.metaAgua)agua++;
    if((o.atividade||[]).length)ativ++;
    if(vs.length&&vs.every(v=>o.vitaminas&&o.vitaminas[v]))vit++;
  });
  const res={ini,fim,nDias:ds.length,diasReg,agua,ativ,vit,por:{},n:0,nMeta:0};
  GL.forEach(([k])=>{const a=por[k].vals;const ok=a.filter(v=>naMeta(k,v)).length;
    res.por[k]={n:a.length,ok,pct:a.length?Math.round(ok/a.length*100):null,media:arred(media(a)),min:a.length?Math.min(...a):null,max:a.length?Math.max(...a):null,vals:a,datas:por[k].datas};
    res.n+=a.length;res.nMeta+=ok;});
  res.pct=res.n?Math.round(res.nMeta/res.n*100):null;
  const pos=['cafe','almoco','jantar'];res.posN=pos.reduce((a,k)=>a+res.por[k].n,0);res.posOk=pos.reduce((a,k)=>a+res.por[k].ok,0);
  return res;
}
/* Últimas N medições de um horário, independentemente da data */
function ultimasMedicoes(k,N){
  const out=[];Object.keys(S.dias).filter(isData).sort().reverse().forEach(d=>{const v=S.dias[d].glic&&S.dias[d].glic[k];if(v!=null&&out.length<N)out.push({d,v:+v})});
  return out;
}
function tendenciaJejum(){
  const t=hoje();const a=statsPeriodo(addDays(t,-6),t).por.jejum,b=statsPeriodo(addDays(t,-13),addDays(t,-7)).por.jejum;
  const r={atual:a.media,antes:b.media,nA:a.n,nB:b.n,dir:null,dif:null};
  if(a.n>=MIN_PADRAO&&b.n>=MIN_PADRAO){r.dif=a.media-b.media;r.dir=Math.abs(r.dif)<2?'estavel':r.dif>0?'sobe':'desce'}
  return r;
}

/* ---------- agrupamento de refeições semelhantes ---------- */
const semAcento=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const ALIMENTOS=[
  ['arroz',/\barroz/],['feijão',/\bfeij/],['frango',/\bfrango|\bgalinha|\bpeito de frango/],['carne',/\bcarne|\bbife|\bpatinho|\bmusculo|\balcatra|\bfile mignon|\bmoida/],
  ['peixe',/\bpeixe|\btilapia|\bsalmao|\batum|\bsardinha|\bmerluza/],['ovo',/\bovo|\bomelete/],['salada',/\bsalada|\balface|\btomate|\bpepino|\brucula|\bfolhas/],
  ['legumes',/\blegume|\bcenoura|\babobrinha|\bbrocolis|\bchuchu|\bvagem|\bbeterraba|\babobora|\bcouve/],['pão',/\bpao|\btorrada|\bsanduiche/],['tapioca',/\btapioca/],['cuscuz',/\bcuscuz/],
  ['macarrão',/\bmacarr|\bmassa\b|\bespaguete|\blasanha|\bnhoque/],['batata/mandioca',/\bbatata|\bpure\b|\bmandioca|\baipim|\binhame|\bmacaxeira/],['café com leite',/\bcafe com leite|\bcafe c\/ leite/],
  ['café',/\bcafe\b(?! com leite)/],['iogurte',/\biogurte/],['queijo',/\bqueijo|\brequeijao|\bricota/],['fruta',/\bfruta|\bbanana|\bmaca\b|\bmamao|\blaranja|\bpera\b|\bmorango|\bmelao|\babacate|\buva|\bmanga\b|\bkiwi|\bmelancia/],
  ['aveia/chia',/\baveia|\bchia|\bgranola|\blinhaca/],['castanhas',/\bcastanha|\bnoz|\bamendoa|\bamendoim/],['leguminosas',/\blentilha|\bgrao de bico|\bgrao-de-bico|\bervilha/],
  ['sopa',/\bsopa|\bcaldo/],['farofa',/\bfarofa/],['polenta',/\bpolenta/],['leite',/\bleite\b/]
];
function chaveRefeicao(desc){
  const t=semAcento(desc).replace(/\([^)]*\)/g,' ');
  let achados=ALIMENTOS.filter(([,re])=>re.test(t)).map(([n])=>n);
  if(achados.includes('café com leite'))achados=achados.filter(n=>n!=='café'&&n!=='leite');
  if(!achados.length){const w=t.replace(/[^a-z ]/g,' ').split(/\s+/).filter(x=>x.length>2&&!['com','sem','uma','umas','uns','colher','colheres','copo','fatia','fatias','porcao','sopa','cha'].includes(x));if(!w.length)return null;achados=w.slice(0,3)}
  return[...new Set(achados)].sort().join(' + ');
}
function padroesRefeicao(){
  const grupos={};
  paresRefeicao().forEach(p=>{const ch=chaveRefeicao(p.desc);if(!ch)return;const id=p.k+'|'+ch;
    (grupos[id]=grupos[id]||{k:p.k,chave:ch,vals:[],datas:[]});grupos[id].vals.push(p.v);grupos[id].datas.push(p.d)});
  return Object.values(grupos).filter(g=>g.vals.length>=MIN_PADRAO).map(g=>{const ok=g.vals.filter(v=>naMeta(g.k,v)).length;return{...g,n:g.vals.length,ok,media:arred(media(g.vals)),pct:ok/g.vals.length}})
    .sort((a,b)=>b.pct-a.pct||b.n-a.n);
}

/* =====================================================================

const COR_SERIE={jejum:'var(--s-jejum)',cafe:'var(--s-cafe)',almoco:'var(--s-almoco)',jantar:'var(--s-jantar)'};
const COR_CLASSE={ok:'var(--leaf)',high:'var(--amber)',low:'var(--danger)'};
function periodoIni(per){return per==='tudo'?primeiraData():addDays(hoje(),-(per-1))}

function chartLinha(k,pts,ini,fim){
  if(!pts.length)return'<p class="muted">Sem medições nesse período. Os registros aparecem aqui assim que forem anotados. 🌱</p>';
  const W=340,H=180,L=30,R=10,T=14,B=24,meta=metaDe(k);
  const vs=pts.map(p=>p.v);let lo=Math.min(60,Math.floor((Math.min(...vs)-5)/10)*10),hi=Math.max(Math.ceil((meta+25)/10)*10,Math.ceil((Math.max(...vs)+5)/10)*10);
  const span=Math.max(1,diffDias(ini,fim));
  const x=d=>L+(diffDias(ini,d)/span)*(W-L-R),y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const band=`<rect x="${L}" y="${y(meta)}" width="${W-L-R}" height="${Math.max(0,y(HIPO)-y(meta))}" fill="var(--leaf-soft)"/>`;
  const grid=[lo,meta,hi].map(v=>`<text x="${L-4}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="var(--muted)">${v}</text>`).join('');
  const ml=`<line x1="${L}" x2="${W-R}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--leaf)" stroke-dasharray="4 4"/>`;
  const linha=pts.length>1?`<polyline fill="none" stroke="${COR_SERIE[k]}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>x(p.d).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')}"/>`:'';
  const r=pts.length>40?2.4:3.6;
  const pontos=pts.map(p=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${r}" fill="${COR_CLASSE[classe(k,p.v)]}" stroke="var(--surface)" stroke-width="1"><title>${br(p.d)}: ${p.v}</title></circle>`).join('');
  const xl=`<text x="${L}" y="${H-6}" font-size="9.5" fill="var(--muted)">${br(ini)}</text><text x="${W-R}" y="${H-6}" font-size="9.5" text-anchor="end" fill="var(--muted)">${br(fim)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de ${GL_CURTO[k]} de ${br(ini)} a ${br(fim)}">${band}${grid}${ml}${linha}${pontos}${xl}</svg>
    <div class="legend"><span>┄ meta &lt; ${meta}</span><span><i style="background:var(--leaf)"></i>dentro da meta</span><span><i style="background:var(--amber)"></i>acima da meta</span><span><i style="background:var(--danger)"></i>abaixo de 70</span></div>`;
}
function pctBars(st){

function pill(k,v){const c=classe(k,v);return c?`<span class="pill ${c}">${TXT_CLASSE[c]}</span>`:''}
function linhaPos(data,r,i,comBotao){
  const p=posDaRefeicao(data,r);if(!p)return'';
  if(p.v!=null)return `<div class="pos">↓ 2h depois: <b>${p.v} mg/dL</b> ${pill(p.k,p.v)}</div>`;
  if(data!==hoje())return `<div class="pos tiny">↓ Glicemia 2h depois não anotada</div>`;
  const pend=(S.config.lembretes.pendentes||[]).find(x=>x.data===data&&x.tipo===p.k);
  let b='';
  if(comBotao){
    if(pend)b=`<span class="pill wait">⏰ lembrete às ${new Date(pend.quando).toTimeString().slice(0,5)}</span>`;
    else if(r.hora){const alvo=horaMais(r.hora,120);if(alvo>agoraHM())b=`<button class="ghost small" data-act="lembrar2h" data-i="${i}">⏰ Lembrar às ${alvo}</button>`}
  }
  return `<div class="pos"><span class="pill wait">↓ glicemia 2h: a anotar</span>${b}</div>`;
}
function horaMais(hm,min){const[h,m]=hm.split(':').map(Number);const t=Math.min(23*60+59,h*60+m+min);return pad(Math.floor(t/60))+':'+pad(t%60)}

function vDesc(){

  const semana=A.n?`
    <div class="stat3"><div><div class="mid">${A.n}</div><div class="tiny">medições</div></div><div><div class="mid">${A.pct}%</div><div class="tiny">dentro da meta</div></div><div><div class="mid">${A.diasReg}/7</div><div class="tiny">dias com registro</div></div></div>

      ${B.n?`<div class="kv"><span>Dentro da meta</span><b>${B.pct}% → ${A.pct}%</b></div>`:''}

      <span class="pill ${tj.dir==='estavel'?'wait':tj.dir==='desce'?'ok':'high'}">${seta[tj.dir]}${tj.dir!=='estavel'?' '+Math.abs(tj.dif)+' mg/dL':''}</span>
      <p class="tiny" style="margin:8px 0 0">Foi observada esta tendência nas medições registradas. Converse sobre ela com sua equipe na consulta.</p>`
    :(tj.nA?`<div class="mid" style="color:var(--plum)">${tj.atual} mg/dL</div><p class="muted" style="margin:6px 0 0">Média dos últimos 7 dias (${tj.nA} medições). Para mostrar a tendência, precisamos de pelo menos ${MIN_PADRAO} medições em cada semana.</p>`:cultivando);
  const refs=['cafe','almoco','jantar'].map(k=>{const u=ultimasMedicoes(k,7),ok=u.filter(x=>naMeta(k,x.v)).length;const nome={cafe:'Seu café da manhã',almoco:'Seu almoço',jantar:'Seu jantar'}[k];const curto={cafe:'o café',almoco:'o almoço',jantar:'o jantar'}[k];
    return `<div class="kv" style="display:block"><b>${EMOJI_POS[k]} ${nome}</b><div class="muted" style="margin-top:2px">${u.length>=MIN_PADRAO?`${ok} das últimas ${u.length} medições após ${curto} ficaram dentro da meta.`:`Ainda poucas medições após ${curto} (${u.length}). Com ${MIN_PADRAO} ou mais, o padrão aparece aqui.`}</div></div>`}).join('');
  const pad=padroesRefeicao(),bons=pad.filter(p=>p.pct>=.6).slice(0,6);
  const funcionou=!pad.length?cultivando:!bons.length?'<p class="muted">Ainda não apareceu uma combinação com a maioria das medições dentro da meta. Continue registrando 🌱</p>':
    bons.map(p=>`<div class="kv" style="display:block"><b>${EMOJI_POS[p.k]} ${esc(p.chave.charAt(0).toUpperCase()+p.chave.slice(1))}</b> <span class="tiny">· ${POS_REF[p.k].toLowerCase()}</span>

  const hist=pares.length?pares.slice(0,nP).map(p=>`<div class="corr">${p.fotoId?`<img class="thumb" data-foto="${esc(p.fotoId)}" alt="">`:`<div class="thumb semfoto" style="font-size:1.4rem">${EMOJI_POS[p.k]}</div>`}
      <div class="t"><b>${POS_REF[p.k]}</b> <span class="tiny">${SEM[parse(p.d).getDay()]} ${br(p.d)}</span><div class="clamp muted">${esc(p.desc)}</div>${p.carbo!=null?`<div class="tiny">≈ ${p.carbo} g de carboidrato</div>`:''}
      <div class="pos">↓ 2h depois: <b>${p.v} mg/dL</b> ${pill(p.k,p.v)}</div></div></div>`).join('')+(pares.length>5?`<button class="link" data-act="corrMais">${S.corrMais?'Mostrar menos':'Ver mais combinações'}</button>`:'')
    :'<p class="muted">Quando uma refeição (café, almoço ou jantar) e a glicemia 2h depois forem anotadas no mesmo dia, a combinação aparece aqui.</p>';
  return `
  <section class="card"><h2>🌱 Sua semana</h2>${semana}</section>
  <section class="card"><h2>🌅 Jejum</h2>${jejum}</section>
  <section class="card"><h2>Após as refeições</h2>${refs}</section>
  <section class="card"><h2>✨ O que funcionou bem para mim?</h2>${funcionou}
    <p class="tiny" style="margin:10px 0 0">Combinações que apareceram pelo menos ${MIN_PADRAO} vezes nos seus registros. Mostram o que foi observado nessas ocasiões — não que um alimento seja “bom” ou “ruim”. Porção, horário, sono, atividade e outros fatores também influenciam.</p></section>
  <section class="card"><h2>Refeição → glicemia</h2>${hist}</section>
  <p class="tiny" style="text-align:center">Descobertas são calculadas no próprio celular, com base nas suas metas (jejum &lt; ${S.config.metas.jejum}, pós &lt; ${S.config.metas.pos}). Não substituem a avaliação da sua equipe.</p>`;
}

function limparTxt(s){return String(s??'').replace(/≈/g,'~').replace(/→/g,'->').replace(/↓/g,'').replace(/↑/g,'').replace(/[✓✔]/g,'').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/\s{2,}/g,' ').trim()}
function codes(s){const out=[];for(const ch of String(s)){const c=ch.codePointAt(0);if(c>=32&&c<=126||c>=160&&c<=255)out.push(c);else if(CP1252[c])out.push(CP1252[c]);else if(c===10||c===9)out.push(32);else out.push(63)}return out}
function larg(s,size,bold){const w=HW[bold?1:0];return codes(s).reduce((a,c)=>a+(w[c-32]||556),0)/1000*size}
function pdfStr(s){return '('+codes(s).map(c=>c===40||c===41||c===92?'\\'+String.fromCharCode(c):c<127?String.fromCharCode(c):'\\'+c.toString(8).padStart(3,'0')).join('')+')'}
function quebrar(s,maxW,size,bold){const pal=limparTxt(s).split(' ');const ls=[];let l='';pal.forEach(p=>{const t=l?l+' '+p:p;if(larg(t,size,bold)<=maxW||!l)l=t;else{ls.push(l);l=p}});if(l)ls.push(l);return ls}

class MiniPDF{
  constructor(){this.W=595.28;this.H=841.89;this.pags=[];this.nova()}
  nova(){this.c=[];this.pags.push(this.c)}
  cor(rgb,f){return rgb.map(v=>v.toFixed(3)).join(' ')+(f?' rg':' RG')}
  txt(x,y,s,o={}){const size=o.size||10,bold=!!o.bold;s=limparTxt(s);let X=x;if(o.align==='right')X=x-larg(s,size,bold);else if(o.align==='center')X=x-larg(s,size,bold)/2;
    this.c.push(`BT /${bold?'F2':'F1'} ${size} Tf ${this.cor(o.color||[.16,.1,.15],1)} ${X.toFixed(2)} ${(this.H-y).toFixed(2)} Td ${pdfStr(s)} Tj ET`)}
  rect(x,y,w,h,o={}){const op=o.fill&&o.stroke?'B':o.fill?'f':'S';this.c.push(`q ${o.fill?this.cor(o.fill,1):''} ${o.stroke?this.cor(o.stroke):''} ${o.lw||.6} w ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${op} Q`)}
  linha(pts,o={}){if(pts.length<2)return;this.c.push(`q ${this.cor(o.color||[0,0,0])} ${o.lw||1} w ${o.dash?'['+o.dash.join(' ')+'] 0 d':''} 1 J 1 j ${pts.map((p,i)=>p[0].toFixed(2)+' '+(this.H-p[1]).toFixed(2)+(i?' l':' m')).join(' ')} S Q`)}
  circ(x,y,r,cor){const k=.5523*r,Y=this.H-y;this.c.push(`q ${this.cor(cor,1)} ${(x+r).toFixed(2)} ${Y.toFixed(2)} m ${(x+r).toFixed(2)} ${(Y+k).toFixed(2)} ${(x+k).toFixed(2)} ${(Y+r).toFixed(2)} ${x.toFixed(2)} ${(Y+r).toFixed(2)} c ${(x-k).toFixed(2)} ${(Y+r).toFixed(2)} ${(x-r).toFixed(2)} ${(Y+k).toFixed(2)} ${(x-r).toFixed(2)} ${Y.toFixed(2)} c ${(x-r).toFixed(2)} ${(Y-k).toFixed(2)} ${(x-k).toFixed(2)} ${(Y-r).toFixed(2)} ${x.toFixed(2)} ${(Y-r).toFixed(2)} c ${(x+k).toFixed(2)} ${(Y-r).toFixed(2)} ${(x+r).toFixed(2)} ${(Y-k).toFixed(2)} ${(x+r).toFixed(2)} ${Y.toFixed(2)} c f Q`)}
  tri(x,y,r,cor){const Y=this.H-y;this.c.push(`q ${this.cor(cor,1)} ${x.toFixed(2)} ${(Y+r).toFixed(2)} m ${(x+r).toFixed(2)} ${(Y-r*.8).toFixed(2)} l ${(x-r).toFixed(2)} ${(Y-r*.8).toFixed(2)} l h f Q`)}
  gerar(){
    const objs=[];const add=s=>{objs.push(s);return objs.length};
    add('<< /Type /Catalog /Pages 2 0 R >>');add('PAGES');
    add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const kids=[];this.pags.forEach(c=>{const s=c.join('\n');const ci=add(`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`))});
    objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
    let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
    const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info << /Title (Nosso Jardim - Relatorio de acompanhamento) /Producer (Nosso Jardim) >> >>\nstartxref\n${x}\n%%EOF`;
    return out;
  }
}

function corrigirComprimentos(pdf){
  // recalcula /Length de cada stream e a tabela xref
  const objs=[];const re=/(\d+) 0 obj\n([\s\S]*?)\nendobj\n/g;let m;
  while((m=re.exec(pdf)))objs.push(m[2]);
  const fix=objs.map(o=>{const i=o.indexOf('\nstream\n');if(i<0)return o;const corpo=o.slice(i+8,o.lastIndexOf('\nendstream'));return o.slice(0,i).replace(/\/Length \d+/,'/Length '+corpo.length)+o.slice(i)});
  const trailer=pdf.slice(pdf.indexOf('trailer'));
  let out='%PDF-1.4\n';const off=[];fix.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=out.length;out+=`xref\n0 ${fix.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+trailer.replace(/startxref\n\d+/,'startxref\n'+x);
  return out;
}

function itensDeHoje(){
  const L=S.config.lembretes,t=hoje(),o=S.dias[t]||emptyDia(t),env=enviadosHoje(),it=[];

    if(L.agua.on)[['10:30',.3],['14:30',.6],['17:30',.85]].forEach(([h,f],i)=>it.push({id:'agua'+i,quando:msAte(h),ok:()=>{const x=S.dias[t];return((x&&x.agua)||0)<Math.ceil(S.config.metaAgua*f)},tit:'Água',txt:'Que tal um copo de água agora? 💧'}));
  }

function agendarLembretes(){

  if(limparLembretes())cache();
  itensDeHoje().forEach(x=>{if(x.quando>0&&x.quando<864e5)lembTimers.push(setTimeout(()=>disparar(x),x.quando))});

    ${!incluir?'<p class="alert info">As fotos <b>não</b> foram incluídas neste backup.</p>':erroFotos?'<p class="alert info">Não consegui ler as fotos; este backup ficou <b>sem fotos</b>.</p>':''}
    <p class="muted">Tamanho: ${(blob.size/1024/1024).toFixed(1).replace('.',',')} MB. Guarde o arquivo fora do celular (Drive, e-mail) para não perder nada se o app for desinstalado.</p>`,
    botoes:[['bkSalvar','Salvar no celular',''],...(podeCompartilharArquivo(S.bkPronto)?[['bkComp','Compartilhar (Drive, e-mail…)','ghost']]:[]),['fecharDlg','Fechar','ghost']]};
  render();
}
function marcarBackup(){S.config.ultimoBackup=new Date().toISOString();cache()}

function validarBackup(obj){
  if(!obj||typeof obj!=='object')return{erro:'O arquivo não é um backup válido.'};
  if(obj.app!=='nosso-jardim')return{erro:'Este arquivo não é um backup do Nosso Jardim.'};
  if(typeof obj.formato!=='number')return{erro:'Backup sem versão de formato.'};
  if(obj.formato>BK_FORMATO)return{erro:'Este backup foi feito por uma versão mais nova do app. Atualize o app antes de restaurar.'};
  const d=obj.dados;if(!d||typeof d!=='object'||!d.dias||typeof d.dias!=='object'||Array.isArray(d.dias)||!d.config||typeof d.config!=='object')return{erro:'O backup está incompleto (faltam registros ou configurações).'};
  const ks=Object.keys(d.dias);
  if(ks.some(k=>!isData(k)||!d.dias[k]||typeof d.dias[k]!=='object'))return{erro:'Os registros do backup estão com formato inesperado.'};
  const fotos=obj.fotos&&typeof obj.fotos==='object'?obj.fotos:{};
  const fotosOk=Object.entries(fotos).filter(([k,v])=>typeof k==='string'&&typeof v==='string'&&/^data:image\//.test(v));
  const ord=ks.sort();
  return{ok:true,dias:ks.length,ini:ord[0],fim:ord[ord.length-1],fotos:fotosOk.length,fotosLista:fotosOk,criadoEm:obj.criadoEm,resgates:Array.isArray(d.config.resgates)?d.config.resgates.length:0};
}

  const v=validarBackup(obj);
  if(!v.ok){S.dlg={tit:'Não foi possível restaurar',html:`<p>${esc(v.erro)}</p><p class="muted">Nenhum dado foi alterado.</p>`,botoes:[['fecharDlg','Entendi','']]};render();return}
  S.restPend={obj,v};
  S.dlg={tit:'📥 Restaurar backup?',html:`<p><b>Nesta restauração, os dados atuais poderão ser substituídos.</b></p>
    <div class="kv"><span>Backup de</span><b>${v.criadoEm?brAno(String(v.criadoEm).slice(0,10)):'data desconhecida'}</b></div>
    <div class="kv"><span>Registros</span><b>${v.dias} dias${v.dias?' ('+br(v.ini)+' a '+br(v.fim)+')':''}</b></div>

    botoes:[['confRestaurar','Restaurar',''],['fecharDlg','Cancelar','ghost']]};
  render();
}

  const p=S.restPend;if(!p)return;S.restPend=null;
  const antes={dias:S.dias,config:S.config};
  // 1) cópia de segurança dos dados atuais
  try{localStorage.setItem('jardim-cache-antes-restauracao',JSON.stringify({salvoEm:new Date().toISOString(),dias:S.dias,config:S.config}))}catch(e){}
  // 2) fotos primeiro (se falhar, nada é trocado)
  try{for(const[k,val]of p.v.fotosLista){await FDB.put(k,val);S.fotoCache[k]=val}}
  catch(e){S.dlg={tit:'Não foi possível restaurar',html:'<p>Faltou espaço para as fotos do backup. Nenhum registro foi alterado.</p>',botoes:[['fecharDlg','Entendi','']]};render();return}
  // 3) registros e configurações, normalizados pela migração
  const dias={};Object.keys(p.obj.dados.dias).forEach(k=>dias[k]=normalizarDia(k,p.obj.dados.dias[k]));
  S.dias=dias;S.config=normalizarConfig(p.obj.dados.config);if(!S.config.premiosVersao)S.config.premiosVersao=4;
  migrar();
  if(!cache()){S.dias=antes.dias;S.config=antes.config;cache();S.dlg={tit:'Não foi possível restaurar',html:'<p>Não havia espaço para gravar os dados do backup. Os dados anteriores foram mantidos.</p>',botoes:[['fecharDlg','Entendi','']]};render();return}
  S.sel=hoje();S.dlg={tit:'✓ Backup restaurado',html:`<p>${Object.keys(S.dias).length} dias de registros e ${totais().total} pontos no total.</p>`,botoes:[['fecharDlg','Ótimo','']]};
  agendarLembretes();render();
}

  if(el.id==='rFim'){S.relFim=el.value;return}

  const o=dia(S.sel);

  if(a==='saveCfg'){const c=S.config;const s=Math.floor(+val('cSem')),dd=Math.floor(+val('cDias')||0),sa=semanaAtual();if(s>=1&&s<=42&&dd>=0&&dd<=6&&(s!==sa.s||dd!==sa.d))c.gestRef={data:hoje(),semanas:s,dias:dd};c.metaAgua=Math.max(4,Math.min(16,+val('cAgua')||10));c.insulinaPadrao=val('cIns')||'NPH';c.vitaminas=val('cVit').split(',').map(x=>x.trim()).filter(Boolean);c.nomeBebe=val('cBebe').slice(0,40);document.activeElement&&document.activeElement.blur();saveConfig();toast('Ajustes salvos.')}
  if(a==='saveMetas'){const j=+val('mJej'),p=+val('mPos');if(!(j>=60&&j<=200)||!(p>=60&&p<=250))return toast('Informe metas entre 60 e 250 mg/dL.');S.config.metas={jejum:Math.round(j),pos:Math.round(p)};document.activeElement&&document.activeElement.blur();saveConfig();toast('Metas salvas. Cores e gráficos atualizados.')}
  if(a==='ask'){const q=val('cq');if(q)ask(q)}

    else ini=addDays(hoje(),-(S.relPer-1));
    try{const pdf=gerarRelatorioPDF(ini,fim,S.config.relObs);const blob=new Blob([pdf],{type:'application/pdf'});

  // Lembretes
  if(a==='testeNotif'){const p=await pedirPermissao();notificar('Nosso Jardim','Os lembretes estão funcionando 🌱','teste');if(p!=='granted')render()}

async function fotoAlbum(file){
  const s=S.albFotoSem;if(s==null)return;
  try{const img=await reduzir(file,900,.8);const id='album-'+s+'-'+Date.now();await FDB.put(id,img);S.fotoCache[id]=img;
    const al=S.config.album[s]||{};if(al.fotoId&&al.fotoId!==id){FDB.del(al.fotoId).catch(()=>{});delete S.fotoCache[al.fotoId]}
    al.fotoId=id;if(S.albDraft!=null)al.nota=S.albDraft;S.config.album[s]=al;saveConfig();toast('Foto guardada no álbum.')}
  catch(e){toast('Não consegui guardar a foto.')}
}

/* ---------- coach ---------- */
function resumo(){
  const sa=semanaAtual(),m=S.config.metas;
  let t=`Semana de gestação: ${sa.s}. Metas de acompanhamento configuradas pela usuária conforme a equipe médica: jejum abaixo de ${m.jejum} e 2h pós-refeição abaixo de ${m.pos} mg/dL. Insulina prescrita pelo endocrinologista (${S.config.insulinaPadrao}).
Regras do app (obrigatórias): não altere, calcule ou sugira doses de insulina ou remédios; não mande suspender medicamentos; não prescreva dieta terapêutica; não diagnostique diabetes nem complicações da gravidez; use as metas acima só para comentar tendências; diante de algo preocupante, oriente contato com a equipe médica ou serviço de emergência conforme a situação.
Últimos 7 dias:\n`;
  for(let i=6;i>=0;i--){const d=addDays(hoje(),-i),o=S.dias[d];if(!o)continue;const g=o.glic||{};
    t+=`${br(d)}: jejum ${g.jejum??'-'}, pós-café ${g.cafe??'-'}, pós-almoço ${g.almoco??'-'}, pós-jantar ${g.jantar??'-'}; insulina ${(o.insulina||[]).map(x=>x.hora+' '+x.un+'UI').join(', ')||'-'}; refeições: ${(o.refeicoes||[]).map(r=>r.tipo+': '+r.desc+(r.carbo!=null?' (~'+r.carbo+' g carbo)':'')).join(' | ')||'-'}; água ${o.agua||0} copos; atividade ${(o.atividade||[]).reduce((a,b)=>a+(+b.min||0),0)} min\n`}
  return t;
}
/* Rede de segurança: se a resposta parecer falar de mudar dose, acrescenta um lembrete claro */
const RE_DOSE=/\b(aument|reduz|diminu|suspend|interromp|par[ae]r? de|pul[ae]r?|ajust|dobr|troqu|mud[ae]r?)\w*\b[^.\n]{0,40}\b(dose|insulina|nph|unidades|\d+\s*ui|medica|rem[eé]dio)/i;
function protegerResposta(txt){if(RE_DOSE.test(txt||''))return txt+'\n\n⚠️ Lembrete importante: qualquer mudança de insulina ou remédio é decidida só pela sua equipe médica.';return txt}
const COACH_URL='https://coach-jardim.gtv-rowe.workers.dev';
async function ask(q){
  if(S.busy)return;
  if(!/^https:/.test(COACH_URL)){toast('Coach ainda não configurado.');return}
  if(navigator.onLine===false){toast('O coach precisa de internet. Tente de novo quando estiver conectada.');return}
  S.busy=true;S.chat.push({role:'user',content:q});const resp={role:'assistant',content:''};S.chat.push(resp);
  const cq=document.getElementById('cq');if(cq)cq.value='';
  document.activeElement&&document.activeElement.blur();render();
  try{
    const r=await fetch(COACH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:S.chat.slice(0,-1).slice(-12),contexto:resumo(),metas:S.config.metas})});
    const d=await r.json();
    resp.content=r.ok?protegerResposta(d.texto):('Não consegui responder agora ('+(d.erro||r.status)+').');
  }catch(e){resp.content='Sem conexão com o coach. Verifique a internet e tente de novo.'}
  S.busy=false;render();
}

async function reduzir(file,max=900,q=.75){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=err;i.src=url});
  const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',q);
}
async function analisarFoto(file){
  if(!/^https:/.test(COACH_URL))return toast('Coach ainda não configurado.');
  if(navigator.onLine===false)return toast('A análise da foto precisa de internet. Você pode anotar a refeição por escrito.');
  const dataSel=S.sel;const tipo=S.ultRefT||(document.getElementById('refT')||{}).value||'Refeição';
  S.fotoBusy=true;render();
  try{
    const foto=(await reduzir(file)).split(',')[1];const mini=await reduzir(file,520,.7);
    const r=await fetch(COACH_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({foto,refeicao:tipo})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.erro||r.status);
    const a=d.analise||{};
    if(a.erro)toast('Não reconheci comida nessa foto. Tente de novo mais de perto.');
    else{
      const o=dia(dataSel);
      const desc=(a.itens||[]).map(x=>x.nome+(x.porcao?' ('+x.porcao+')':'')).join(', ')||'Prato fotografado';
      let fotoId=null;try{fotoId='f'+Date.now();await FDB.put(fotoId,mini);S.fotoCache[fotoId]=mini}catch(e){fotoId=null}
      const ref={tipo,desc,carbo:Math.round(+a.carbo_total_g||0),kcal:Math.round(+a.kcal_total||0),dica:a.dica||'',fotoId};
      if(dataSel===hoje())ref.hora=agoraHM();
      o.refeicoes.push(ref);
      S.fotoBusy=false;saveDia(o);toast(ref.hora?`${tipo} registrado às ${ref.hora} pela foto.`:'Refeição adicionada pela foto.');autoLembrete(o,ref);return;
    }
  }catch(e){toast('Não consegui analisar agora ('+e.message+').')}
  S.fotoBusy=false;render();
}

migrar();
render();
agendarLembretes();
let diaAberto=hoje();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const t=hoje();if(t!==diaAberto){if(S.sel===diaAberto)S.sel=t;diaAberto=t}agendarLembretes();if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()});
(async()=>{
  if(!(window.claude&&claude.use))return;
  const db=await claude.use('db');if(!db)return;
  S.db=db;let first=true;
  db.collection('dias').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=clone(d.data())});
    if(first){first=false;Object.keys(S.dias).forEach(k=>{if(!m[k]){m[k]=S.dias[k];db.collection('dias').doc(k).set(S.dias[k]).catch(()=>{})}})}
    S.dias=m;cache();render();
  },()=>toast('Sem conexão com a nuvem. Usando dados do aparelho.'));
  db.doc('config/geral').onSnapshot(d=>{if(d.exists){S.config=normalizarConfig({...defaultConfig(),...clone(d.data())});cache();render()}else{db.doc('config/geral').set(S.config).catch(()=>{})}});
})();
